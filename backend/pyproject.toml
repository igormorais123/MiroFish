[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - motor versatil de inteligencia coletiva para simulacao e previsao"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # Framework principal
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "gunicorn>=23.0.0; platform_system != 'Windows'",
    "waitress>=3.0.0",  # WSGI prod server p/ codex_proxy + llm_proxy (evita MemoryError do Werkzeug em payloads >5MB)

    # Integracao com LLM
    "openai>=1.0.0",
    
    # Simulacao social via OASIS; a versao 0.2.5 exige CAMEL-AI 0.2.78.
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # Processamento de arquivos
    "PyMuPDF>=1.24.0",
    # Deteccao de codificacao (inclui arquivos texto fora de UTF-8)
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # Utilitarios
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # Transitiva via requests/openai. Pin minimo para fechar
    # 2 alertas Dependabot (high): cross-origin header forward em
    # redirect proxied e bypass de decompression-bomb safeguard.
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pip-audit>=2.10.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pip-audit>=2.10.0",
]

[tool.uv]
override-dependencies = [
    "tiktoken>=0.12.0",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "lxml>=6.1.0",
    "mcp>=1.28.1",
    "mistune>=3.2.1",
    "msgpack>=1.2.1",
    "nbconvert>=7.17.1",
    "nltk>=3.9.4",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pygments>=2.20.0",
    "pypdf>=6.10.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "transformers>=5.0.0rc3",
    "unstructured>=0.18.18",
    "pandas>=2.2.3",
    "torch==2.8.0+cpu",
    "soupsieve>=2.8.4",
    "starlette>=1.3.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
